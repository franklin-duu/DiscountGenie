version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: steam_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: steam_sales
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  ai-service:
    build: ./ai-service
    container_name: steam_ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build: ./server
    container_name: steam_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - db
      - ai-service